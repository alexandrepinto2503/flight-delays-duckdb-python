services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio-data:/data

  duckdb:
    image: flight-delay-average:local
    working_dir: /app
    environment:
      JOB_NAME: flight-delay-average
      S3_BUCKET: alexp-teste
      INPUT_PATH: s3://alexp-teste/input/flight-delays/*.csv
      INPUT_AIRPORTS_PATH: s3://alexp-teste/input/airports/*.csv
      INPUT_AIRLINES_PATH: s3://alexp-teste/input/airlines/*.csv
      OUTPUT_PATH: s3://alexp-teste/output/teste-output.csv
      S3_ENDPOINT_URL: http://localhost:9002
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    depends_on:
      - minio
    network_mode: host
    volumes:
      - .:/app
      - ./input:/seed:ro


volumes:
  minio-data: